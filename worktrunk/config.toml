# Global worktrunk config: the user layer that runs for every repo. Per-repo
# steps belong in that repo's committed .config/wt.toml, which worktrunk runs
# after these.

# Background hook after `wt` creates a worktree. Runs from the new worktree's
# root. The script decides whether the repo is one it has a profile for.
[post-start]
profile = "~/.config/worktrunk/hooks/post-start"
