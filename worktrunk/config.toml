# Global worktrunk config: the user layer that runs for every repo. Per-repo
# steps belong in each repo's committed .config/wt.toml, which worktrunk runs
# after this file's hooks.

# Blocking, so a repo's own pre-start hook can rely on what this one writes.
# worktrunk starts user and project post-start hooks together, with no order.
[pre-start]
profile = "~/.config/worktrunk/hooks/pre-start"

# Blocking: a failed drop stops the removal, so no database is left behind.
[pre-remove]
teardown = "~/.config/worktrunk/hooks/pre-remove"

# --no-cd keeps the console out of the new worktree; worktrunk/README.md says
# why. --execute runs herdr from inside the new worktree, so `.` is its path.
# --label gives the workspace a short label; worktrunk/README.md says why.
[aliases]
herdr = 'wt switch --create {{ args }} --no-cd --execute herdr -- worktree open --cwd {{ primary_worktree_path }} --path . --focus --label {% set words = args[0] | split("-") %}{{ ("#" ~ words[1] ~ " " ~ words[2:4] | join(" ")) | trim if args[0] is startingwith("zorn/issue-") else args[0] }}'
