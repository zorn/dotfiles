name: Lint PR

# `pull_request`, deliberately, where the action's own README suggests
# `pull_request_target`. That suggestion exists so forks get a usable token,
# but the only API call here is `pulls.get` (the action re-fetches the title,
# since the event payload goes stale on a re-run), which needs no more than
# the `pull-requests: read` below — and a fork opening a PR against a public
# repo already gets that much. `pull_request_target` would buy nothing and
# would hand a write-capable token to a workflow one careless checkout step
# away from running fork code with it.
"on":
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-pr:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full option reference:
      # https://github.com/amannn/action-semantic-pull-request
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The conventional-commit types, newline-delimited. This is the full
          # commitizen set rather than the handful the history actually uses,
          # so the linter never blocks a legitimate title over a type this
          # repo simply hasn't needed yet.
          types: |
            fix
            feat
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Subjects are lowercase here, so reject a leading capital.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
          # Escape hatches for pull requests that shouldn't be held to the
          # convention. Note that adding a label does not re-run this job —
          # `labeled` is deliberately not in the trigger list above — so a
          # label takes effect on the next edit or push.
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
