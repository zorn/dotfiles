name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # One job per bin/check section, so the pull request page names the check
  # that failed. Each job name is a required-status-check context on the
  # protect-main ruleset. Renaming or adding a job means updating the ruleset
  # too, or the check silently stops being required.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # bin/check scans commit history, not just the working tree, so the
          # default depth-1 checkout would leave it nothing to look at.
          fetch-depth: 0

      # Pinned to a version and a digest. This is the job whose whole purpose
      # is supply-chain hygiene, so it does not pipe an unverified tarball
      # into tar. Bumping the version means bumping the checksum with it —
      # take both from the release's checksums.txt.
      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: 1.8.1
          BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
        run: |
          set -euo pipefail
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/betterleaks"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${tarball}"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      - name: Run checks
        run: ./bin/check secrets

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned and checksum-verified the same way as betterleaks in the secrets
      # job, from the release's actionlint_<version>_checksums.txt. The runner
      # already has shellcheck, which actionlint picks up off PATH to lint
      # `run:` blocks.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run checks
        run: ./bin/check workflows

  # shellcheck, python3 and jq come with the runner image, so these three
  # jobs install nothing.
  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run checks
        run: ./bin/check shell

  skills:
    name: skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run checks
        run: ./bin/check skills

  link:
    name: link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run checks
        run: ./bin/check link
