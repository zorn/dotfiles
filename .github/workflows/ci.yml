name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # One job per bin/check section, so the pull request page names the check
  # that failed rather than one tick for everything. Each job name is a
  # required-status-check context on the protect-main ruleset: renaming or
  # adding a job means updating the ruleset too, or the check silently stops
  # being required. Each job runs its section of bin/check, never the check
  # itself inlined, so there is still one definition of "green".
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # bin/check scans commit history, not just the working tree, so the
          # default depth-1 checkout would leave it nothing to look at.
          fetch-depth: 0

      # Pinned to a version and a digest. This is the job whose whole purpose
      # is supply-chain hygiene, so it does not pipe an unverified tarball
      # into tar. Bumping the version means bumping the checksum with it —
      # take both from the release's gitleaks_<version>_checksums.txt.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Run checks
        run: ./bin/check secrets

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned the same way as gitleaks in the secrets job, for the same
      # reason — a verified checksum, from the release's
      # actionlint_<version>_checksums.txt. The runner already has
      # shellcheck, which actionlint picks up off PATH to lint `run:` blocks.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run checks
        run: ./bin/check workflows

  # shellcheck, python3 and jq come with the runner image, so these three
  # jobs install nothing.
  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run checks
        run: ./bin/check shell

  skills:
    name: skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run checks
        run: ./bin/check skills

  link:
    name: link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run checks
        run: ./bin/check link
